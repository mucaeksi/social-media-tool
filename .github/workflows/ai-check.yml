name: Canlı sosyal medya AI kontrolü
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Kontrol türü
        type: choice
        options:
          - full
          - caption_probe
        default: full
  schedule:
    - cron: "5 0 20 10 *"
permissions:
  contents: write
concurrency:
  group: social-ai-check
  cancel-in-progress: false
env:
  NPM_CONFIG_CACHE: /tmp/sosyal-studio-npm-cache
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: schedule
        name: Tek seferlik kota sonrası kontrol
        env:
          AI_CHECK_EVENT: ${{ github.event_name }}
        run: |
          if [ "$AI_CHECK_EVENT" != "schedule" ] || [ "$(date -u +%F)" = "2026-10-20" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.schedule.outputs.enabled == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.schedule.outputs.enabled == 'true'
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.schedule.outputs.enabled == 'true'
      - run: node scripts/check-ai.mjs
        if: steps.schedule.outputs.enabled == 'true'
        env:
          AI_CHECK_MODE: ${{ inputs.mode || 'full' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: ${{ always() && steps.schedule.outputs.enabled == 'true' && hashFiles('.cloudflare/ai-check.json') != '' }}
        run: node scripts/record-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_SOURCE: .cloudflare/ai-check.json
          RECEIPT_DESTINATION: deployment/ai-check.json
