name: Canlı sosyal medya AI kontrolü
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: social-ai-check
  cancel-in-progress: false
env:
  NPM_CONFIG_CACHE: /tmp/sosyal-studio-npm-cache
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-ai.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: ${{ always() && hashFiles('.cloudflare/ai-check.json') != '' }}
        run: node scripts/record-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_SOURCE: .cloudflare/ai-check.json
          RECEIPT_DESTINATION: deployment/ai-check.json
