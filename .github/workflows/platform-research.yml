name: Resmi sosyal platform belgelerini incele
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: platform-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: python3 scripts/research-platforms.py
      - run: node scripts/record-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_SOURCE: .cloudflare/platform-research.json
          RECEIPT_DESTINATION: deployment/platform-research.json
