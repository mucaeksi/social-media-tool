name: Sosyal hesap tarayıcısı kontrolü
on:
  push:
    branches: [main]
    paths: [.github/workflows/browser-check.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: social-browser
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Giriş sayfalarını kimlik bilgisi kullanmadan kontrol et
        run: node scripts/check-browser-login.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/record-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_SOURCE: .cloudflare/browser-check.json
          RECEIPT_DESTINATION: deployment/browser-check.json
